[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-ai-studio-arabic"
version = "7.0.0"
description = "منصة صوتيات عربية لتوليد الصوت والأعمال اليمنية واستنساخ الصوت المصرح به"
readme = "README.md"
requires-python = ">=3.9,<3.14"
license = {text = "MIT"}
authors = [{name = "Voice AI Studio"}]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
    "aiofiles>=24.0.0",
    "requests>=2.31.0",
    "pydub>=0.25.1",
    "soundfile>=0.12.1",
    "edge-tts>=7.0.0,<8.0.0",
    "piper-tts>=1.6.0,<2.0.0",
    "imageio-ffmpeg>=0.5.1",
]

[project.optional-dependencies]
clone = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "coqui-tts>=0.27.5",
]
colab = [
    "google-genai>=0.3.0",
    "kokoro>=0.8.4",
    "coqui-tts>=0.27.5",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:Couldn't find ffmpeg or avconv.*:RuntimeWarning:pydub.utils",
]

[tool.ruff]
line-length = 120
target-version = "py39"
