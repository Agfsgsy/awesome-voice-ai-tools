<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>استوديو ابن الواقدي</title>
<style>
:root{--sidebar:286px;--top:76px;--bg:#050b14;--panel:#0c1727;--panel2:#101e31;--line:#1f344f;--text:#f5f8ff;--muted:#91a5bd;--green:#24c6a4;--blue:#268fff;--gold:#d8ac43;--red:#ff7878;--shadow:0 18px 45px rgba(0,0,0,.25)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,Arial,sans-serif}.app{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);height:100%;background:radial-gradient(circle at 85% 0,#15395e 0,#081321 35%,#040911 100%)}.sidebar{background:linear-gradient(180deg,#0c1b2e,#081321);border-left:1px solid #1d314c;padding:16px 13px;display:flex;flex-direction:column;min-width:0;z-index:30;transition:.22s}.brand{display:flex;align-items:center;gap:11px;padding:7px 8px 18px;border-bottom:1px solid rgba(255,255,255,.07)}.logo{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#1c4160,#10263d);font-size:25px;box-shadow:0 10px 28px rgba(0,0,0,.24)}.brandText{min-width:0}.brandName{font-weight:950;font-size:17px;white-space:nowrap}.brandVersion{font-size:11px;color:#80e9d4;margin-top:4px}.search{position:relative;margin:15px 3px 11px}.search input{width:100%;background:#091525;color:#fff;border:1px solid #203651;border-radius:12px;padding:11px 37px 11px 10px;outline:none}.search span{position:absolute;right:13px;top:10px;color:#7890aa}.navScroll{overflow:auto;padding:0 2px 8px;scrollbar-width:thin}.groupTitle{font-size:11px;color:#6f849d;font-weight:900;padding:14px 10px 7px}.navItem{width:100%;border:1px solid transparent;background:transparent;color:#dce7f5;border-radius:13px;padding:11px 10px;margin:3px 0;display:flex;align-items:center;gap:11px;text-align:right;cursor:pointer;transition:.18s}.navItem:hover{background:#10233a;border-color:#1d3c5f}.navItem.active{background:linear-gradient(135deg,#123c4b,#12315a);border-color:#2f7e8b;box-shadow:0 10px 24px rgba(0,0,0,.18)}.navIcon{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:#142944;font-size:18px;flex:0 0 auto}.navCopy{min-width:0}.navTitle{display:block;font-weight:900;font-size:14px}.navDesc{display:block;color:#8297af;font-size:10px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sidebarBottom{margin-top:auto;padding:12px 7px 3px;border-top:1px solid rgba(255,255,255,.07)}.contact{direction:ltr;color:#ffd877;font-weight:900;font-size:15px}.smallState{display:flex;align-items:center;gap:7px;color:#8095ad;font-size:11px;margin-top:8px}.liveDot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}.main{min-width:0;display:grid;grid-template-rows:var(--top) minmax(0,1fr)}.topbar{height:var(--top);background:rgba(8,20,34,.94);backdrop-filter:blur(14px);border-bottom:1px solid #1d3049;display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:14px}.topStart{display:flex;align-items:center;gap:12px;min-width:0}.menuBtn,.iconBtn{width:42px;height:42px;border:1px solid #29415e;background:#10223a;color:#fff;border-radius:12px;cursor:pointer;font-size:18px}.pageMeta{min-width:0}.pageTitle{font-weight:950;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.breadcrumb{color:#7990aa;font-size:11px;margin-top:4px}.topActions{display:flex;gap:8px;align-items:center}.statusChip{display:flex;align-items:center;gap:7px;background:#0b2b2e;border:1px solid #245f5d;color:#94efdf;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:900;white-space:nowrap}.content{min-height:0;position:relative;background:#06101c}.frame{width:100%;height:100%;border:0;background:#07111e;display:block}.loading{position:absolute;inset:0;display:none;place-items:center;background:rgba(5,11,20,.62);backdrop-filter:blur(3px);z-index:10}.loading.show{display:grid}.loaderCard{background:#0d1b2d;border:1px solid #29415f;border-radius:18px;padding:20px 25px;box-shadow:var(--shadow);text-align:center}.spinner{width:32px;height:32px;border-radius:50%;border:3px solid #29415f;border-top-color:var(--green);animation:spin .75s linear infinite;margin:0 auto 10px}@keyframes spin{to{transform:rotate(360deg)}}.app.collapsed{grid-template-columns:82px minmax(0,1fr)}.app.collapsed .brandText,.app.collapsed .search,.app.collapsed .groupTitle,.app.collapsed .navCopy,.app.collapsed .sidebarBottom{display:none}.app.collapsed .brand{justify-content:center;padding-inline:0}.app.collapsed .navItem{justify-content:center;padding-inline:7px}.app.collapsed .sidebar{padding-inline:10px}.mobileShade{display:none}.palette{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;place-items:start center;padding-top:12vh}.palette.show{display:grid}.paletteBox{width:min(620px,92vw);background:#0d1b2d;border:1px solid #2c4564;border-radius:18px;box-shadow:0 25px 70px rgba(0,0,0,.5);overflow:hidden}.paletteInput{width:100%;background:#101f32;color:white;border:0;border-bottom:1px solid #29415f;padding:17px;font-size:17px;outline:none}.paletteList{max-height:410px;overflow:auto;padding:8px}.paletteItem{padding:12px;border-radius:11px;cursor:pointer;display:flex;gap:11px;align-items:center}.paletteItem:hover{background:#152941}.paletteItem b{display:block}.paletteItem small{color:#879bb3}@media(max-width:980px){.app{grid-template-columns:1fr}.sidebar{position:fixed;right:0;top:0;bottom:0;width:min(310px,86vw);transform:translateX(105%);box-shadow:-18px 0 50px rgba(0,0,0,.4)}.app.mobileOpen .sidebar{transform:translateX(0)}.mobileShade{position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:20}.app.mobileOpen .mobileShade{display:block}.statusChip{display:none}.topbar{padding:0 11px}.pageTitle{font-size:17px}.app.collapsed{grid-template-columns:1fr}.app.collapsed .brandText,.app.collapsed .search,.app.collapsed .groupTitle,.app.collapsed .navCopy,.app.collapsed .sidebarBottom{display:initial}}@media(max-width:560px){:root{--top:68px}.topActions .iconBtn:nth-child(2){display:none}.breadcrumb{display:none}.topbar{gap:6px}.pageTitle{font-size:15px}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="mobileShade" id="shade"></div>
  <aside class="sidebar">
    <div class="brand"><div class="logo">🎙️</div><div class="brandText"><div class="brandName">استوديو ابن الواقدي</div><div class="brandVersion">Professional Studio 3.4</div></div></div>
    <div class="search"><span>⌕</span><input id="navSearch" placeholder="ابحث عن أداة..." autocomplete="off"></div>
    <div class="navScroll" id="navScroll">
      <div class="groupTitle">الرئيسية</div>
      <button class="navItem active" data-page="/static/dashboard.html" data-title="لوحة التحكم" data-desc="نظرة عامة وحالة النظام"><span class="navIcon">⌂</span><span class="navCopy"><span class="navTitle">لوحة التحكم</span><span class="navDesc">الحالة والاختصارات والملفات</span></span></button>
      <div class="groupTitle">مركز الإنتاج</div>
      <button class="navItem" data-page="/static/producer.html" data-title="المنتج الصوتي" data-desc="صوت واحد، موسيقى، ومقابلات"><span class="navIcon">🎚️</span><span class="navCopy"><span class="navTitle">المنتج الصوتي</span><span class="navDesc">فيديو، بودكاست، موعظة وموسيقى</span></span></button>
      <button class="navItem" data-page="/static/interview_pro.html" data-title="المقابلات البشرية Pro" data-desc="إنتاج مقابلات متعددة الأصوات"><span class="navIcon">🎤</span><span class="navCopy"><span class="navTitle">المقابلات البشرية Pro</span><span class="navDesc">سيناريو وأصوات وماستر بودكاست</span></span></button>
      <button class="navItem" data-page="/static/interview_ultra.html" data-title="الحوار الطبيعي Ultra" data-desc="أعلى وضع للحوار الطبيعي"><span class="navIcon">🧠</span><span class="navCopy"><span class="navTitle">الحوار الطبيعي Ultra</span><span class="navDesc">سياق حواري وتبديل تلقائي</span></span></button>
      <div class="groupTitle">الأدوات المتقدمة</div>
      <button class="navItem" data-page="/static/pro.html" data-title="الاستوديو الكامل" data-desc="جميع أدوات التحرير والإنتاج"><span class="navIcon">🎛️</span><span class="navCopy"><span class="navTitle">الاستوديو الكامل</span><span class="navDesc">النصوص، المواعظ، المؤثرات والاستنساخ</span></span></button>
      <button class="navItem" data-action="exports" data-title="ملفات الاستوديو"><span class="navIcon">📁</span><span class="navCopy"><span class="navTitle">ملفات الاستوديو</span><span class="navDesc">فتح مجلد النتائج على سطح المكتب</span></span></button>
    </div>
    <div class="sidebarBottom"><div class="contact">+967771550103</div><div class="smallState"><span class="liveDot"></span><span id="sidebarState">النظام يعمل محليًا بأمان</span></div></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topStart"><button class="menuBtn" id="menuBtn" title="القائمة">☰</button><div class="pageMeta"><div class="pageTitle" id="pageTitle">لوحة التحكم</div><div class="breadcrumb" id="breadcrumb">استوديو ابن الواقدي / نظرة عامة وحالة النظام</div></div></div>
      <div class="topActions"><div class="statusChip" id="keyChip"><span class="liveDot"></span><span>فحص المفاتيح...</span></div><button class="iconBtn" id="commandBtn" title="بحث سريع Ctrl+K">⌕</button><button class="iconBtn" id="refreshBtn" title="تحديث الصفحة">↻</button><button class="iconBtn" id="fullBtn" title="ملء الشاشة">⛶</button></div>
    </header>
    <section class="content"><iframe id="frame" class="frame"></iframe><div class="loading" id="loading"><div class="loaderCard"><div class="spinner"></div><b>جاري فتح الأداة...</b></div></div></section>
  </main>
</div>
<div class="palette" id="palette"><div class="paletteBox"><input class="paletteInput" id="paletteInput" placeholder="اكتب اسم الأداة ثم اضغط Enter..."><div class="paletteList" id="paletteList"></div></div></div>
<script>
const VERSION='3.4.0';const app=document.getElementById('app');const frame=document.getElementById('frame');const loading=document.getElementById('loading');const navItems=[...document.querySelectorAll('.navItem[data-page]')];let loadToken=0;
const modules=navItems.map(b=>({page:b.dataset.page,title:b.dataset.title,desc:b.dataset.desc||'',icon:b.querySelector('.navIcon').textContent}));
function activeButton(page){navItems.forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function openPage(page,title,desc='',remember=true){activeButton(page);document.getElementById('pageTitle').textContent=title||'استوديو ابن الواقدي';document.getElementById('breadcrumb').textContent='استوديو ابن الواقدي / '+(desc||title||'');loading.classList.add('show');const token=++loadToken;frame.src='about:blank';setTimeout(()=>{if(token===loadToken)frame.src=page+'?v='+VERSION+'&t='+Date.now()},30);if(remember)localStorage.setItem('studio:lastPage',page);app.classList.remove('mobileOpen')}
function injectStudioPolish(doc){if(!doc||doc.getElementById('ibn-shell-polish'))return;const style=doc.createElement('style');style.id='ibn-shell-polish';style.textContent=`html,body{scrollbar-color:#315171 #07111e}body{background:#07111e!important}.wrap{max-width:none!important;padding:18px!important}.card,.box,.hero{border-color:#203750!important;box-shadow:0 14px 34px rgba(0,0,0,.13)!important}.btn,.primary,button{transition:transform .16s ease,border-color .16s ease,filter .16s ease}.btn:hover,.primary:hover,button:hover{filter:brightness(1.07)}.buttons{gap:9px!important}.status{border-radius:13px!important}.sticky{top:12px!important}input,select,textarea{border-color:#29425f!important} @media(max-width:700px){.wrap{padding:10px!important}.buttons{display:grid!important;grid-template-columns:1fr!important}}`;doc.head.appendChild(style)}
frame.addEventListener('load',()=>{try{const w=frame.contentWindow;if(!w||String(w.location.href)==='about:blank')return;const nativeFetch=w.fetch.bind(w);w.fetch=(input,init)=>{let url=typeof input==='string'?input:(input&&input.url)||input;if(typeof url==='string'&&url.includes('/api/dialogue-ultra/render'))url=url.replace('/api/dialogue-ultra/render','/api/dialogue-safe/render');return nativeFetch(url,init)};injectStudioPolish(w.document)}catch(e){console.warn(e)}loading.classList.remove('show')});
navItems.forEach(b=>b.onclick=()=>openPage(b.dataset.page,b.dataset.title,b.dataset.desc));document.querySelector('[data-action="exports"]').onclick=openExports;
async function openExports(){try{const r=await fetch('/api/dashboard/open-exports',{method:'POST'});const d=await r.json();if(!r.ok)throw new Error(d.detail||'تعذر فتح المجلد')}catch(e){alert(e.message)}}
window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='studio:navigate'&&d.page){const found=navItems.find(b=>b.dataset.page===d.page);openPage(d.page,d.title||(found&&found.dataset.title)||'أداة',found?found.dataset.desc:'')}});
document.getElementById('menuBtn').onclick=()=>{if(innerWidth<=980)app.classList.toggle('mobileOpen');else app.classList.toggle('collapsed')};document.getElementById('shade').onclick=()=>app.classList.remove('mobileOpen');document.getElementById('refreshBtn').onclick=()=>{const page=frame.src.split('?')[0].replace(location.origin,'');const found=navItems.find(b=>b.dataset.page===page);openPage(page,(found&&found.dataset.title)||document.getElementById('pageTitle').textContent,(found&&found.dataset.desc)||'',false)};document.getElementById('fullBtn').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{}};
const search=document.getElementById('navSearch');search.oninput=()=>{const q=search.value.trim().toLowerCase();navItems.forEach(b=>{const text=(b.dataset.title+' '+(b.dataset.desc||'')).toLowerCase();b.style.display=!q||text.includes(q)?'flex':'none'})};
const palette=document.getElementById('palette'),paletteInput=document.getElementById('paletteInput'),paletteList=document.getElementById('paletteList');function drawPalette(q=''){const filtered=modules.filter(m=>(m.title+' '+m.desc).toLowerCase().includes(q.toLowerCase()));paletteList.innerHTML=filtered.map((m,i)=>`<div class="paletteItem" data-i="${i}" data-page="${m.page}"><span class="navIcon">${m.icon}</span><span><b>${m.title}</b><small>${m.desc}</small></span></div>`).join('');[...paletteList.children].forEach(el=>el.onclick=()=>{const m=modules.find(x=>x.page===el.dataset.page);if(m){openPage(m.page,m.title,m.desc);closePalette()}})}function openPalette(){palette.classList.add('show');drawPalette();setTimeout(()=>paletteInput.focus(),30)}function closePalette(){palette.classList.remove('show');paletteInput.value=''}document.getElementById('commandBtn').onclick=openPalette;palette.onclick=e=>{if(e.target===palette)closePalette()};paletteInput.oninput=()=>drawPalette(paletteInput.value);paletteInput.onkeydown=e=>{if(e.key==='Escape')closePalette();if(e.key==='Enter'){const first=paletteList.querySelector('.paletteItem');if(first)first.click()}};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}if(e.key==='Escape'){closePalette();app.classList.remove('mobileOpen')}});
async function refreshKeyChip(){try{const r=await fetch('/api/dashboard/status');const d=await r.json();const g=d.gemini||{};document.getElementById('keyChip').innerHTML=`<span class="liveDot"></span><span>${g.count||0} مفتاح Gemini • ${g.working||0} يعمل</span>`;document.getElementById('sidebarState').textContent=(d.engines||[]).length+' محركات جاهزة'}catch{document.getElementById('keyChip').lastElementChild.textContent='حالة المفاتيح غير متاحة'}}
const saved=localStorage.getItem('studio:lastPage');const initial=navItems.find(b=>b.dataset.page===saved)||navItems[0];openPage(initial.dataset.page,initial.dataset.title,initial.dataset.desc,false);refreshKeyChip();
</script>
</body>
</html>
