<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استوديو ابن الواقدي</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#040a12;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:#fff}.top{min-height:74px;background:linear-gradient(135deg,#0c2035,#123f62);border-bottom:1px solid #ffffff22;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;gap:14px}.brand{font-size:22px;font-weight:900}.phone{direction:ltr;color:#ffd87c;font-weight:800}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{border:1px solid #315374;background:#19314d;color:#fff;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.tab.active{background:#11695d;border-color:#42d5b8}.tab.ultra{background:#624a13;border-color:#b18a2d}.frame{width:100%;height:calc(100% - 74px);border:0;background:#07111e}@media(max-width:980px){.top{min-height:126px;align-items:flex-start;flex-direction:column}.frame{height:calc(100% - 126px)}.brand{font-size:18px}.tab{padding:8px 10px}}@media(max-width:620px){.top{min-height:174px}.frame{height:calc(100% - 174px)}.tab{font-size:13px}}</style></head><body><header class="top"><div><div class="brand">🎙️ استوديو ابن الواقدي</div><div class="phone">+967771550103</div></div><nav class="tabs"><button class="tab active" data-page="/static/producer.html">المنتج الصوتي</button><button class="tab" data-page="/static/interview_pro.html">المقابلات البشرية Pro</button><button class="tab ultra" data-page="/static/interview_ultra.html">الحوار الطبيعي Ultra</button><button class="tab" data-page="/static/pro.html">الاستوديو الكامل</button></nav></header><iframe id="frame" class="frame" src="/static/producer.html"></iframe><script>const f=document.getElementById('frame');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');f.src=b.dataset.page});</script></body></html>
