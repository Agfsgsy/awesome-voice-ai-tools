<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>استوديو ابن الواقدي</title>
  <style>
    :root{--side:290px;--top:76px;--bg:#050b14;--line:#203650;--text:#f5f8ff;--muted:#8ba0b8;--green:#24c6a4;--blue:#268fff;--gold:#d9ad43}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,Arial,sans-serif}
    .app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);height:100%;background:radial-gradient(circle at 85% 0,#15395e 0,#081321 35%,#040911 100%)}
    .sidebar{background:linear-gradient(180deg,#0c1b2e,#07111e);border-left:1px solid #1d314c;padding:15px 12px;display:flex;flex-direction:column;z-index:30;transition:.22s}
    .brand{display:flex;align-items:center;gap:11px;padding:7px 8px 17px;border-bottom:1px solid #ffffff12}.logo{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#1d4565,#10263d);font-size:25px}.brandName{font-weight:950;font-size:17px}.brandVersion{font-size:11px;color:#80e9d4;margin-top:4px}
    .search{position:relative;margin:14px 3px 8px}.search input{width:100%;background:#091525;color:#fff;border:1px solid #203651;border-radius:12px;padding:11px 38px 11px 10px;outline:none}.search span{position:absolute;right:13px;top:10px;color:#7890aa}
    .navScroll{overflow:auto;padding:0 2px 8px;scrollbar-width:thin}.group{font-size:11px;color:#6f849d;font-weight:900;padding:13px 10px 6px}.navItem{width:100%;border:1px solid transparent;background:transparent;color:#dce7f5;border-radius:13px;padding:10px;margin:3px 0;display:flex;align-items:center;gap:10px;text-align:right;cursor:pointer}.navItem:hover{background:#10233a;border-color:#1d3c5f}.navItem.active{background:linear-gradient(135deg,#123d4b,#12315b);border-color:#2f7e8b}.navItem.yemeni{background:linear-gradient(135deg,#143b2c,#3d3013);border-color:#5e6a34}.navItem.yemeni.active{background:linear-gradient(135deg,#19634c,#795513);border-color:#d2a338}.navItem.clone{background:linear-gradient(135deg,#172f4c,#2f1d45);border-color:#4d4a78}.navItem.clone.active{background:linear-gradient(135deg,#18557b,#65417f);border-color:#63c7dc}.navIcon{width:37px;height:37px;display:grid;place-items:center;border-radius:11px;background:#142944;font-size:18px;flex:0 0 auto}.navTitle{display:block;font-weight:900;font-size:14px}.navDesc{display:block;color:#8297af;font-size:10px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
    .bottom{margin-top:auto;padding:12px 8px 3px;border-top:1px solid #ffffff12}.contact{direction:ltr;color:#ffd877;font-weight:900}.state{display:flex;align-items:center;gap:7px;color:#8095ad;font-size:11px;margin-top:8px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}
    .main{min-width:0;display:grid;grid-template-rows:var(--top) minmax(0,1fr)}.topbar{height:var(--top);background:rgba(8,20,34,.96);border-bottom:1px solid #1d3049;display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:12px}.topStart,.topActions{display:flex;align-items:center;gap:9px;min-width:0}.iconBtn{width:42px;height:42px;border:1px solid #29415e;background:#10223a;color:#fff;border-radius:12px;cursor:pointer;font-size:18px}.pageTitle{font-weight:950;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crumb{color:#7990aa;font-size:11px;margin-top:4px}
    .keyChip{display:flex;align-items:center;gap:7px;background:#0b2b2e;border:1px solid #245f5d;color:#94efdf;border-radius:999px;padding:9px 13px;font-size:11px;font-weight:900;cursor:pointer;white-space:nowrap}.keyChip.bad{background:#322711;border-color:#715a25;color:#ffe29a}.keyChip.bad .dot{background:var(--gold);box-shadow:0 0 12px var(--gold)}
    .content{min-height:0;position:relative;background:#06101c}.frame{width:100%;height:100%;border:0;background:#07111e}.loading{position:absolute;inset:0;display:none;place-items:center;background:#050b14a8;z-index:10}.loading.show{display:grid}.loader{background:#0d1b2d;border:1px solid #29415f;border-radius:17px;padding:19px 24px;text-align:center}.spin{width:31px;height:31px;border-radius:50%;border:3px solid #29415f;border-top-color:var(--green);animation:s .75s linear infinite;margin:0 auto 9px}@keyframes s{to{transform:rotate(360deg)}}
    .collapsed{grid-template-columns:82px minmax(0,1fr)}.collapsed .brandCopy,.collapsed .search,.collapsed .group,.collapsed .navCopy,.collapsed .bottom{display:none}.collapsed .brand,.collapsed .navItem{justify-content:center}.shade{display:none}
    @media(max-width:980px){.app{grid-template-columns:1fr}.sidebar{position:fixed;right:0;top:0;bottom:0;width:min(310px,87vw);transform:translateX(105%);box-shadow:-18px 0 50px #0007}.app.mobile .sidebar{transform:translateX(0)}.shade{position:fixed;inset:0;background:#0008;z-index:20}.app.mobile .shade{display:block}.keyChip{display:none}.topbar{padding:0 11px}.collapsed{grid-template-columns:1fr}.collapsed .brandCopy,.collapsed .search,.collapsed .group,.collapsed .navCopy,.collapsed .bottom{display:initial}}
  </style>
</head>
<body>
<div class="app" id="app"><div class="shade" id="shade"></div>
  <aside class="sidebar">
    <div class="brand"><div class="logo">🎙️</div><div class="brandCopy"><div class="brandName">استوديو ابن الواقدي</div><div class="brandVersion" id="brandVersion">Professional Studio 6.2.0 — Voice Clone Pro</div></div></div>
    <div class="search"><span>⌕</span><input id="search" placeholder="ابحث عن أداة..."></div>
    <div class="navScroll">
      <div class="group">الرئيسية</div>
      <button class="navItem active" data-page="/static/dashboard.html" data-title="لوحة التحكم" data-desc="الحالة والاختصارات والملفات"><span class="navIcon">⌂</span><span class="navCopy"><span class="navTitle">لوحة التحكم</span><span class="navDesc">الحالة والاختصارات والملفات</span></span></button>
      <div class="group">أدوات الصوت المتقدمة</div>
      <button class="navItem clone" data-page="/static/voice_clone.html" data-title="استنساخ الصوت Pro" data-desc="ملفات صوت مصرح بها • XTTS محلي • Human Pro"><span class="navIcon">🧬</span><span class="navCopy"><span class="navTitle">استنساخ الصوت Pro</span><span class="navDesc">عينة حقيقية • فحص جودة • ماستر 320kbps</span></span></button>
      <div class="group">الإبداع اليمني</div>
      <button class="navItem yemeni" data-page="/static/yemeni_creative.html" data-title="الإهداءات والأشعار اليمنية" data-desc="زامل وشيلة وقصيدة ونجاح وموسيقى أصلية"><span class="navIcon">🇾🇪</span><span class="navCopy"><span class="navTitle">الإهداءات والأشعار اليمنية</span><span class="navDesc">نجاح • تفوق • زامل • شيلة • إهداء</span></span></button>
      <div class="group">مركز الإنتاج</div>
      <button class="navItem" data-page="/static/producer.html" data-title="المنتج الصوتي" data-desc="فيديو وبودكاست وموسيقى"><span class="navIcon">🎚️</span><span class="navCopy"><span class="navTitle">المنتج الصوتي</span><span class="navDesc">صوت واحد، نصوص وموسيقى</span></span></button>
      <button class="navItem" data-page="/static/interview_pro.html" data-title="المقابلات البشرية Pro" data-desc="حفظ المشاهد والاستكمال"><span class="navIcon">🎤</span><span class="navCopy"><span class="navTitle">المقابلات البشرية Pro</span><span class="navDesc">المحرك المختار فقط • استكمال محفوظ</span></span></button>
      <button class="navItem" data-page="/static/interview_ultra.html" data-title="الحوار الطبيعي Ultra" data-desc="أعلى وضع للحوار الطبيعي"><span class="navIcon">🧠</span><span class="navCopy"><span class="navTitle">الحوار الطبيعي Ultra</span><span class="navDesc">صوت مجاني افتراضي • مزودات اختيارية</span></span></button>
      <div class="group">الإعدادات والأدوات</div>
      <button class="navItem" data-page="/static/gemini_keys.html" data-title="مركز مفاتيح Gemini" data-desc="فحص بطلب واحد واعتماد من الإنتاج"><span class="navIcon">🔐</span><span class="navCopy"><span class="navTitle">مركز مفاتيح Gemini</span><span class="navDesc">فحص صوت واحد منخفض الاستهلاك</span></span></button>
      <button class="navItem" data-page="/static/pro.html" data-title="الاستوديو الكامل" data-desc="كل أدوات التحرير والإنتاج"><span class="navIcon">🎛️</span><span class="navCopy"><span class="navTitle">الاستوديو الكامل</span><span class="navDesc">المواعظ والمؤثرات والاستنساخ القديم المصحح</span></span></button>
      <button class="navItem" data-action="exports"><span class="navIcon">📁</span><span class="navCopy"><span class="navTitle">ملفات الاستوديو</span><span class="navDesc">فتح النتائج على سطح المكتب</span></span></button>
    </div>
    <div class="bottom"><div class="contact">+967771550103</div><div class="state"><span class="dot" id="sideDot"></span><span id="sideState">جاري فحص الإصدار الموحد...</span></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="topStart"><button class="iconBtn" id="menu">☰</button><div><div class="pageTitle" id="title">لوحة التحكم</div><div class="crumb" id="crumb">استوديو ابن الواقدي / نظرة عامة</div></div></div><div class="topActions"><button class="keyChip bad" id="keyChip"><span class="dot"></span><span>جاري استعادة الجلسة</span></button><button class="iconBtn" id="refresh">↻</button><button class="iconBtn" id="full">⛶</button></div></header>
    <section class="content"><iframe id="frame" class="frame"></iframe><div class="loading" id="loading"><div class="loader"><div class="spin"></div><b>جاري فتح الأداة...</b></div></div></section>
  </main>
</div>
<script>
  const app=document.getElementById('app'),frame=document.getElementById('frame'),loading=document.getElementById('loading'),items=[...document.querySelectorAll('.navItem[data-page]')];
  let token=0,VERSION='6.2.0';
  function plain(v){if(v==null)return'';if(typeof v==='string')return v;if(typeof v==='number'||typeof v==='boolean')return String(v);if(Array.isArray(v))return v.map(plain).filter(Boolean).join(' | ');if(typeof v==='object'){for(const k of ['message','detail','error','reason','status']){if(v[k]!=null){const t=plain(v[k]);if(t)return t}}try{return JSON.stringify(v)}catch{return String(v)}}return String(v)}
  async function loadVersion(){try{const r=await fetch('/api/studio/version'),d=await r.json();if(r.ok&&d.version){VERSION=d.version;document.getElementById('brandVersion').textContent=`Professional Studio ${d.version} — ${d.release||'Voice Clone Pro'}`}}catch{}}
  function openPage(page,title,desc='',remember=true){items.forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('title').textContent=title||'استوديو ابن الواقدي';document.getElementById('crumb').textContent='استوديو ابن الواقدي / '+(desc||title||'');loading.classList.add('show');const current=++token;frame.src='about:blank';setTimeout(()=>{if(current===token)frame.src=page+'?v='+encodeURIComponent(VERSION)+'&t='+Date.now()},30);if(remember)localStorage.setItem('studio:lastPage',page);app.classList.remove('mobile');resumeSession()}
  function polish(w){try{const doc=w.document;if(!doc.getElementById('studio-polish')){const s=doc.createElement('style');s.id='studio-polish';s.textContent='html,body{scrollbar-color:#315171 #07111e}body{background:#07111e!important}.wrap{max-width:none!important;padding:18px!important}.card,.box,.hero{border-color:#203750!important;box-shadow:0 14px 34px rgba(0,0,0,.13)!important}.btn,.primary,button{transition:.16s}.btn:hover,.primary:hover,button:hover{filter:brightness(1.07)}';doc.head.appendChild(s)}w.__studioPlain=plain;if(typeof w.plain==='function')w.plain=plain;w.addEventListener('unhandledrejection',e=>console.error('Studio page error:',plain(e.reason)))}catch(e){console.warn(e)}}
  frame.addEventListener('load',()=>{try{const w=frame.contentWindow;if(!w||String(w.location.href)==='about:blank')return;const nativeFetch=w.fetch.bind(w);w.fetch=(input,init)=>{let url=typeof input==='string'?input:(input&&input.url)||input;if(typeof url==='string'&&url.includes('/api/dialogue-ultra/render'))url=url.replace('/api/dialogue-ultra/render','/api/dialogue-safe/render');return nativeFetch(url,init)};polish(w)}catch(e){console.warn(e)}loading.classList.remove('show');resumeSession()});
  window.addEventListener('message',event=>{const d=event.data||{};if(event.source!==frame.contentWindow||d.type!=='studio:navigate')return;const page=String(d.page||'').split('?')[0],target=items.find(item=>item.dataset.page===page);if(target)openPage(page,target.dataset.title,target.dataset.desc)});
  items.forEach(b=>b.onclick=()=>openPage(b.dataset.page,b.dataset.title,b.dataset.desc));
  document.querySelector('[data-action="exports"]').onclick=async()=>{try{const r=await fetch('/api/dashboard/open-exports',{method:'POST'}),d=await r.json();if(!r.ok)throw new Error(plain(d.detail||d.message));}catch(e){alert(plain(e.message))}};
  document.getElementById('menu').onclick=()=>innerWidth<=980?app.classList.toggle('mobile'):app.classList.toggle('collapsed');document.getElementById('shade').onclick=()=>app.classList.remove('mobile');document.getElementById('refresh').onclick=()=>{const p=frame.src.split('?')[0].replace(location.origin,''),b=items.find(x=>x.dataset.page===p);openPage(p,(b&&b.dataset.title)||document.getElementById('title').textContent,(b&&b.dataset.desc)||'',false)};document.getElementById('full').onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch{}};
  const search=document.getElementById('search');search.oninput=()=>{const q=search.value.trim().toLowerCase();items.forEach(b=>b.style.display=!q||(b.dataset.title+' '+(b.dataset.desc||'')).toLowerCase().includes(q)?'flex':'none')};
  async function resumeSession(){try{await fetch('/api/gemini-session/resume',{method:'POST'})}catch{}}
  async function refreshKeys(){try{const [kr,sr,hr]=await Promise.all([fetch('/api/gemini/keys'),fetch('/api/gemini-session/status'),fetch('/api/studio/health')]),d=await kr.json(),s=await sr.json(),h=await hr.json(),active=(d.keys||[]).find(k=>k.active&&k.verified),verified=(d.keys||[]).filter(k=>k.verified).length,pending=Number(s.pending_verifications||0),freeReady=h.success&&h.free_first,chip=document.getElementById('keyChip');chip.classList.toggle('bad',!active&&!freeReady);chip.querySelector('span:last-child').textContent=active?`${verified} مؤكد • ${active.label}${pending?' • انتظار '+pending:''}`:'الصوت المجاني جاهز • Gemini اختياري';document.getElementById('sideState').textContent=h.success?(active?'الصوت المجاني جاهز • '+active.label:'الصوت العربي المجاني جاهز'):'تعذر فحص النظام';document.getElementById('sideDot').style.background=freeReady?'var(--green)':'var(--gold)'}catch{document.getElementById('sideState').textContent='الاتصال المحلي غير جاهز'}}
  document.getElementById('keyChip').onclick=()=>openPage('/static/gemini_keys.html','مركز مفاتيح Gemini','فحص بطلب واحد واعتماد من الإنتاج');
  (async()=>{await loadVersion();const remembered=localStorage.getItem('studio:lastPage'),first=items.find(x=>x.dataset.page===remembered)||items[0];openPage(first.dataset.page,first.dataset.title,first.dataset.desc,false);resumeSession();refreshKeys();setInterval(refreshKeys,8000);setInterval(resumeSession,20000)})();
</script>
</body>
</html>
