<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>استوديو المواعظ والصوت العربي</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2d;--panel2:#12243a;--text:#eef7ff;--muted:#9eb1c7;--brand:#20c9a6;--brand2:#168bff;--danger:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#12355a 0,#07111f 42%,#040a13 100%);color:var(--text);font-family:"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:28px 18px 60px}.hero{display:flex;gap:20px;align-items:center;justify-content:space-between;margin-bottom:22px}.hero h1{margin:0;font-size:clamp(26px,5vw,46px)}.hero p{margin:8px 0 0;color:var(--muted)}.badge{background:rgba(32,201,166,.12);border:1px solid rgba(32,201,166,.35);padding:9px 14px;border-radius:999px;color:#79f1d8;white-space:nowrap}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.card{background:rgba(13,27,45,.92);border:1px solid rgba(158,177,199,.16);border-radius:20px;padding:22px;box-shadow:0 18px 55px rgba(0,0,0,.28)}label{display:block;font-weight:700;margin:0 0 8px}.hint{color:var(--muted);font-size:13px;margin-top:6px}textarea,select,input{width:100%;border:1px solid #29425f;background:#081625;color:var(--text);border-radius:12px;padding:12px;font-size:15px;outline:none}textarea:focus,select:focus,input:focus{border-color:var(--brand)}textarea{min-height:260px;resize:vertical;line-height:1.9}.field{margin-bottom:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.profiles{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.profile{border:1px solid #29425f;background:#0a1828;color:var(--text);padding:12px;border-radius:12px;cursor:pointer;text-align:right}.profile.active{border-color:var(--brand);background:rgba(32,201,166,.12)}.profile small{display:block;color:var(--muted);margin-top:4px}.range-row{display:flex;align-items:center;gap:10px}.range-row input{padding:0}.value{min-width:48px;text-align:center;color:#7fead3}.primary{width:100%;border:0;border-radius:13px;padding:15px 20px;font-size:17px;font-weight:800;color:white;background:linear-gradient(135deg,var(--brand),var(--brand2));cursor:pointer;box-shadow:0 10px 30px rgba(22,139,255,.22)}.primary:disabled{opacity:.55;cursor:wait}.status{margin-top:14px;padding:12px;border-radius:12px;background:#081625;color:var(--muted);min-height:46px}.status.error{color:#ffd1d1;border:1px solid rgba(255,107,107,.45)}.result{display:none;margin-top:16px}.result.show{display:block}audio{width:100%;margin:10px 0}.download{display:inline-block;text-decoration:none;background:#19314d;color:white;padding:10px 18px;border-radius:10px}.templates{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chip{border:1px solid #29425f;background:#0a1828;color:#bfe2ff;border-radius:999px;padding:7px 11px;cursor:pointer}.notice{margin-top:18px;color:#f7d78a;background:rgba(240,180,50,.09);border:1px solid rgba(240,180,50,.25);padding:12px;border-radius:12px;font-size:13px}.spinner{display:inline-block;width:17px;height:17px;border:3px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:s .8s linear infinite;vertical-align:middle;margin-left:8px}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:800px){.grid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.two{grid-template-columns:1fr}.profiles{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><div><h1>🎙️ استوديو المواعظ والصوت العربي</h1><p>أصوات عربية متعددة، أنماط إلقاء جاهزة، ومؤثرات صوتية احترافية.</p></div><div class="badge">Voice AI Studio Pro</div></div>
  <div class="grid">
    <section class="card">
      <div class="field"><label for="text">النص</label><textarea id="text" placeholder="اكتب الموعظة أو الدعاء أو التعليق الصوتي هنا..."></textarea><div class="templates"><button class="chip" data-text="الحمد لله الذي بنعمته تتم الصالحات، والصلاة والسلام على رسول الله. أما بعد...">مقدمة موعظة</button><button class="chip" data-text="اللهم يا رحمن يا رحيم، اشرح صدورنا، ويسر أمورنا، واغفر لنا ولوالدينا.">دعاء قصير</button><button class="chip" data-text="إن النجاح لا يأتي صدفة، بل يبدأ بخطوة صادقة، وعمل مستمر، وتوكل على الله.">تحفيزي</button></div><div class="hint"><span id="count">0</span> / 5000 حرف</div></div>
      <button id="generate" class="primary">إنشاء الصوت الاحترافي</button>
      <div id="status" class="status">جاهز لإنشاء الصوت.</div>
      <div id="result" class="result"><audio id="audio" controls></audio><a id="download" class="download" download>تحميل الصوت</a></div>
    </section>
    <aside class="card">
      <div class="field"><label for="voice">الصوت العربي</label><select id="voice">
        <optgroup label="اليمن"><option value="ar-YE-SalehNeural">صالح — يمني (رجل)</option><option value="ar-YE-MaryamNeural">مريم — يمنية (امرأة)</option></optgroup>
        <optgroup label="السعودية"><option selected value="ar-SA-HamedNeural">حامد — سعودي (رجل)</option><option value="ar-SA-ZariyahNeural">زارية — سعودية (امرأة)</option></optgroup>
        <optgroup label="مصر"><option value="ar-EG-ShakirNeural">شاكر — مصري (رجل)</option><option value="ar-EG-SalmaNeural">سلمى — مصرية (امرأة)</option></optgroup>
        <optgroup label="الخليج"><option value="ar-AE-HamdanNeural">حمدان — إماراتي</option><option value="ar-AE-FatimaNeural">فاطمة — إماراتية</option><option value="ar-KW-FahedNeural">فهد — كويتي</option><option value="ar-KW-NouraNeural">نورة — كويتية</option><option value="ar-OM-AbdullahNeural">عبدالله — عُماني</option><option value="ar-QA-MoazNeural">معاذ — قطري</option><option value="ar-BH-AliNeural">علي — بحريني</option></optgroup>
        <optgroup label="بلاد الشام والعراق"><option value="ar-IQ-BasselNeural">باسل — عراقي</option><option value="ar-IQ-RanaNeural">رنا — عراقية</option><option value="ar-JO-TaimNeural">تيم — أردني</option><option value="ar-LB-RamiNeural">رامي — لبناني</option><option value="ar-SY-LaithNeural">ليث — سوري</option></optgroup>
        <optgroup label="المغرب العربي"><option value="ar-MA-JamalNeural">جمال — مغربي</option><option value="ar-DZ-IsmaelNeural">إسماعيل — جزائري</option><option value="ar-TN-HediNeural">الهادي — تونسي</option><option value="ar-LY-OmarNeural">عمر — ليبي</option></optgroup>
      </select></div>
      <div class="field"><label>أسلوب الإلقاء</label><div class="profiles" id="profiles">
        <button class="profile active" data-profile="natural">طبيعي<small>متوازن وواضح</small></button>
        <button class="profile" data-profile="sermon_calm">واعظ هادئ<small>متأنٍ ودافئ</small></button>
        <button class="profile" data-profile="sermon_powerful">خطيب قوي<small>عميق وحازم</small></button>
        <button class="profile" data-profile="dua_emotional">دعاء مؤثر<small>هادئ وخاشع</small></button>
        <button class="profile" data-profile="documentary">وثائقي رزين<small>مناسب للقصص</small></button>
        <button class="profile" data-profile="energetic">حماسي<small>نشط وتحفيزي</small></button>
      </div></div>
      <div class="field"><label for="effect">المؤثر بعد التوليد</label><select id="effect"><option value="none">بدون مؤثر</option><option value="clean_voice">تنقية ووضوح</option><option value="sermon_calm">جو موعظة هادئة</option><option value="sermon_powerful">خطيب قوي</option><option value="dua_emotional">دعاء مؤثر</option><option value="mosque">صدى مسجد</option><option value="studio">استوديو احترافي</option><option value="documentary">وثائقي رزين</option><option value="radio">إذاعي</option><option value="deep_voice">تعميق الصوت</option><option value="echo">صدى واضح</option></select></div>
      <div class="field"><label for="speed">السرعة</label><div class="range-row"><input id="speed" type="range" min="0.65" max="1.35" value="1" step="0.05"><span id="speedValue" class="value">1.00×</span></div></div>
      <div class="notice">هذه أصوات مولدة بالذكاء الاصطناعي. لا تنسب الصوت إلى شيخ أو قارئ حقيقي، وراجع النصوص الدينية قبل نشرها.</div>
    </aside>
  </div>
</div>
<script>
const API="";let profile="natural";const $=id=>document.getElementById(id);const status=(msg,error=false)=>{$("status").textContent=msg;$("status").className="status"+(error?" error":"")};
$("text").addEventListener("input",()=>{$("count").textContent=$("text").value.length});$("speed").addEventListener("input",()=>{$("speedValue").textContent=Number($("speed").value).toFixed(2)+"×"});
document.querySelectorAll(".profile").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".profile").forEach(x=>x.classList.remove("active"));b.classList.add("active");profile=b.dataset.profile}));document.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{$("text").value=b.dataset.text;$("text").dispatchEvent(new Event("input"))}));
async function jsonFetch(url,options){const r=await fetch(url,options);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||d.message||("HTTP "+r.status));return d}
$("generate").addEventListener("click",async()=>{const text=$("text").value.trim();if(!text)return status("اكتب النص أولًا.",true);if(text.length>5000)return status("النص أطول من 5000 حرف.",true);const btn=$("generate");btn.disabled=true;btn.innerHTML='<span class="spinner"></span> جارٍ إنشاء الصوت...';$("result").classList.remove("show");try{status("يتم الآن إنشاء الصوت العربي...");const voice=$("voice").value+"|"+profile;let data=await jsonFetch(API+"/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,engine:"edge",language:"ar",voice,speed:Number($("speed").value),pitch:0})});if(!data.url)throw new Error(data.message||"لم يتم إنشاء الصوت");let finalUrl=data.url;const effect=$("effect").value;if(effect!=="none"){status("تم إنشاء الصوت، جارٍ تطبيق المؤثر الاحترافي...");const audioResponse=await fetch(data.url);if(!audioResponse.ok)throw new Error("تعذر قراءة ملف الصوت");const blob=await audioResponse.blob();const form=new FormData();form.append("file",new File([blob],"generated.mp3",{type:blob.type||"audio/mpeg"}));form.append("preset",effect);const effected=await jsonFetch(API+"/api/effects/apply",{method:"POST",body:form});finalUrl=effected.url||finalUrl}$("audio").src=finalUrl+"?t="+Date.now();$("download").href=finalUrl;$("result").classList.add("show");status("تم إنشاء الصوت بنجاح. يمكنك الاستماع إليه أو تحميله.")}catch(e){status("حدث خطأ: "+e.message,true)}finally{btn.disabled=false;btn.textContent="إنشاء الصوت الاحترافي"}});
</script>
</body>
</html>
