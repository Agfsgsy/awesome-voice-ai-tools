name: voice_ai_mobile
description: تطبيق Voice AI Studio العربي الأصلي للهواتف والأجهزة اللوحية
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^6.1.4
  dio: ^5.8.0+1
  ffmpeg_kit_flutter_new_audio: 2.5.2
  file_picker: ^10.1.9
  flutter_local_notifications: ^22.2.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^15.1.2
  intl: ^0.20.2
  just_audio: ^0.10.4
  mobile_scanner: ^7.4.0
  multicast_dns: ^0.3.3
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.0+1
  record: ^6.0.0
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
