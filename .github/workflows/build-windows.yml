name: Build Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "desktop_app.py"
      - "main.py"
      - "requirements*.txt"
      - "build/**"
      - "installer/**"
      - ".github/workflows/build-windows.yml"
  push:
    branches:
      - "agent/professional-tts-engine"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: Validate Python source
        shell: pwsh
        run: |
          python -m compileall -q main.py desktop_app.py backend

      - name: Build desktop application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean build/VoiceAIStudio.spec
          if (-not (Test-Path "dist/VoiceAIStudioArabic/VoiceAIStudioArabic.exe")) {
            throw "Desktop executable was not created."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\VoiceAIStudio.iss"
          if (-not (Test-Path "dist-installer/VoiceAIStudioSetup.exe")) {
            throw "Installer was not created."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: VoiceAIStudio-Windows-Setup
          path: dist-installer/VoiceAIStudioSetup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: VoiceAIStudio-Windows-Portable
          path: dist/VoiceAIStudioArabic
          if-no-files-found: error
          retention-days: 14
