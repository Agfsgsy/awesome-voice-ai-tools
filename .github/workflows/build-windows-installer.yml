name: Build Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "desktop_app.py"
      - "main.py"
      - "backend/**"
      - "frontend/**"
      - "requirements*.txt"
      - "VoiceAIStudio.spec"
      - "installer/**"
      - ".github/workflows/build-windows-installer.yml"
  push:
    branches:
      - agent/professional-tts-engine
    paths:
      - "desktop_app.py"
      - "main.py"
      - "backend/**"
      - "frontend/**"
      - "requirements*.txt"
      - "VoiceAIStudio.spec"
      - "installer/**"
      - ".github/workflows/build-windows-installer.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt

      - name: Build desktop application
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean VoiceAIStudio.spec

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\VoiceAIStudio.iss"'

      - name: Upload installable application
        uses: actions/upload-artifact@v4
        with:
          name: VoiceAIStudioArabic-Windows-Installer
          path: dist_installer/*.exe
          if-no-files-found: error
          retention-days: 30
